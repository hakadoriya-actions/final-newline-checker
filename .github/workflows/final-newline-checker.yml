name: final-newline-checker

on:
  pull_request:

jobs:
  final-newline-checker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: hakadoriya-actions/final-newline-checker@2f652b06d206e27a478864e8d1498fba1959cdaf
        id: final-newline-checker
        with:
          # NOTE: If you want to fail on missing final newline, set this to true
          #fail-on-missing: true
          #paths: |-
          #  ^action.yml
          #  ^missing-final-newline.md
          paths-ignore: |-
            .*\.gif$
            .*\.ico$
            .*\.jpeg$
            .*\.jpg$
            .*\.png$
            .*\.svg$
            .*\.webp$
